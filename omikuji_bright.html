<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>キラキラ！今日のおみくじ</title>
<style>
:root{font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#643563}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;background:linear-gradient(125deg,#fff0a6,#ffc7e9,#bcefff,#dcffc9);background-size:350% 350%;animation:bgmove 12s ease infinite}body:before{content:'🌸  ✨  🌈  ⭐  🍀';position:fixed;top:5%;left:0;width:100%;font-size:clamp(22px,5vw,40px);text-align:center;letter-spacing:2vw;opacity:.75;pointer-events:none;animation:float 5s ease-in-out infinite}.panel{width:min(100%,510px);position:relative;z-index:1;background:#ffffffdf;backdrop-filter:blur(15px);border:4px solid white;border-radius:36px;padding:32px 24px;text-align:center;box-shadow:0 20px 65px #e55ba74a,0 0 0 8px #ffffff55}.eyebrow{display:inline-block;padding:7px 16px;border-radius:99px;background:#fff4b7;color:#a56522;font-size:.85rem;font-weight:800}.shrine{font-size:65px;filter:drop-shadow(0 9px 3px #dc8baf22);animation:float 3s ease-in-out infinite}h1{font-size:clamp(2rem,7vw,3rem);margin:6px 0 8px;background:linear-gradient(90deg,#fc557d,#bd52ea,#ff9c16);background-clip:text;color:transparent}p.lead{margin:0 0 22px;color:#815c82}.ticket{position:relative;display:grid;place-items:center;min-height:248px;border-radius:26px;background:linear-gradient(145deg,#fffbe8,#fff0f7);border:3px dashed #f8b5d2;overflow:hidden;padding:24px 16px;transition:transform .3s,background .3s}.ticket.winner{background:linear-gradient(145deg,#fff9c4,#ffe4f6,#dafaff);border-color:#ffd466;animation:pop .65s ease both}.ticket.shaking{animation:shake .12s ease-in-out infinite}.placeholder{font-size:4rem;line-height:1.3}.hint{font-weight:700;color:#a77ba3}.fortune{font-size:clamp(3.8rem,15vw,6rem);font-weight:1000;line-height:1.2;color:#fd5290;text-shadow:3px 3px #ffe06d;animation:pop .7s ease both}.message{font-size:1.05rem;font-weight:750;line-height:1.7;max-width:360px}.lucky{font-size:.92rem;background:white;border-radius:40px;padding:8px 18px;margin-top:8px}.draw{margin-top:22px;appearance:none;border:0;border-radius:999px;padding:17px 35px;width:100%;font-size:1.2rem;font-weight:900;color:white;cursor:pointer;background:linear-gradient(90deg,#ff6898,#fb8c3a,#e15cf5);box-shadow:0 9px 0 #db5795,0 14px 22px #f286ac66;transition:transform .15s,box-shadow .15s;animation:glow 2s ease-in-out infinite}.draw:hover{filter:brightness(1.07);transform:translateY(-3px)}.draw:active{transform:translateY(6px);box-shadow:0 3px 0 #db5795}.draw:disabled{opacity:.8;cursor:wait}.foot{font-size:.8rem;margin:20px 0 0;color:#987c98}.spark{position:fixed;pointer-events:none;z-index:10;top:-30px;animation:fall var(--time) linear forwards;font-size:var(--size);left:var(--left);transform:rotate(0)}@keyframes fall{to{top:110vh;transform:translateX(var(--drift)) rotate(var(--rotation));opacity:.2}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes bgmove{50%{background-position:100% 50%}}@keyframes pop{0%{transform:scale(.5) rotate(-7deg);opacity:0}65%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1);opacity:1}}@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}@keyframes glow{50%{box-shadow:0 9px 0 #db5795,0 0 28px #ffcf42}}@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="panel"><div class="eyebrow">✨ わくわく運だめし ✨</div><div class="shrine" aria-hidden="true">⛩️</div><h1>今日のおみくじ</h1><p class="lead">きょうはどんなラッキーが待っているかな？</p>
<section class="ticket" id="ticket" aria-live="polite"><div id="content"><div class="placeholder">🎁</div><div class="hint">ボタンを押して運勢をチェック！</div></div></section>
<button class="draw" id="draw" type="button">🎋 おみくじを引く！</button><p class="foot">何度でも引けるよ！　※お楽しみ用の占いです</p></main>
<script>
const fortunes=[
{name:'大吉',message:'最高の一日になりそう！新しいことに挑戦しよう！',color:'ゴールド 🌟'},
{name:'中吉',message:'うれしい出来事があるかも。笑顔を忘れずに！',color:'スカイブルー 💙'},
{name:'小吉',message:'小さな幸せが見つかる日。身近なことに注目！',color:'グリーン 🍀'},
{name:'吉',message:'コツコツ頑張れば、良いことが起こりそう！',color:'オレンジ 🧡'},
{name:'末吉',message:'焦らずゆっくり進もう。きっといい方向へ！',color:'パープル 💜'},
{name:'凶',message:'今日は少し慎重に。落ち着いて行動すれば大丈夫！',color:'ホワイト 🤍'}];
const button=document.getElementById('draw'),ticket=document.getElementById('ticket'),content=document.getElementById('content');
let busy=false;
function confetti(){const icons=['🌟','✨','🎉','🌸','💖','⭐','🍀','🎊'];for(let i=0;i<58;i++){const span=document.createElement('span');span.className='spark';span.textContent=icons[Math.floor(Math.random()*icons.length)];span.style.setProperty('--left',Math.random()*100+'vw');span.style.setProperty('--size',(13+Math.random()*20)+'px');span.style.setProperty('--time',(2.2+Math.random()*2.5)+'s');span.style.setProperty('--drift',(Math.random()-.5)*180+'px');span.style.setProperty('--rotation',(Math.random()*900-450)+'deg');document.body.appendChild(span);span.addEventListener('animationend',()=>span.remove(),{once:true});}}
button.addEventListener('click',()=>{if(busy)return;busy=true;button.disabled=true;button.textContent='✨ 運勢を占っています… ✨';ticket.classList.remove('winner');ticket.classList.add('shaking');content.innerHTML='<div class="placeholder">🎋</div><div class="hint">ドキドキ…！</div>';setTimeout(()=>{const f=fortunes[Math.floor(Math.random()*fortunes.length)];ticket.classList.remove('shaking');ticket.classList.add('winner');content.replaceChildren();const title=document.createElement('div');title.className='fortune';title.textContent=f.name;const msg=document.createElement('div');msg.className='message';msg.textContent=f.message;const lucky=document.createElement('div');lucky.className='lucky';lucky.textContent='ラッキーカラー：'+f.color;content.append(title,msg,lucky);confetti();button.textContent='🔁 もう一度引く！';button.disabled=false;busy=false;},1050);});
</script>
</body></html>
